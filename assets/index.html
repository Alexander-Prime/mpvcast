    <h1>mpvcast</h1>

    <form id="add">
      <input type="url" name="url" placeholder="Paste a link" required />
      <button>Add</button>
    </form>

    <p id="title">Nothing playing</p>
    <input id="scrubber" type="range" min="0" max="0" step="1" value="0" />
    <p id="clock"></p>

    <div id="transport">
      <button data-post="/playback/previous" title="Previous" aria-label="Previous">
        <svg aria-hidden="true"><use href="#icon-previous" /></svg>
      </button>
      <button
        data-post="/playback/position"
        data-delta="-10"
        title="Back 10s"
        aria-label="Back 10 seconds"
      >
        <svg aria-hidden="true"><use href="#icon-back" /></svg>
      </button>
      <button id="playpause" title="Play" aria-label="Play">
        <svg aria-hidden="true"><use href="#icon-play" /></svg>
      </button>
      <button
        data-post="/playback/position"
        data-delta="10"
        title="Forward 10s"
        aria-label="Forward 10 seconds"
      >
        <svg aria-hidden="true"><use href="#icon-forward" /></svg>
      </button>
      <button data-post="/playback/next" title="Next" aria-label="Next">
        <svg aria-hidden="true"><use href="#icon-next" /></svg>
      </button>
    </div>

    <div id="volume-row">
      <button id="mute" title="Mute" aria-label="Mute">Mute</button>
      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        step="1"
        value="100"
        title="Volume"
        aria-label="Volume"
      />
    </div>

    <label id="quality-row" title="Applies to the next item loaded">
      Quality
      <select id="quality">
        <option value="" hidden>Custom</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </label>

    <div id="errors"></div>

    <h2>Queue</h2>
    <ol id="queue"></ol>
    <button id="clear">Clear queue</button>

    <script src="/app.js" defer></script>
  </body>
</html>
