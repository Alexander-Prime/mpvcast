<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mpvcast</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>mpvcast</h1>

    <form id="add">
      <input type="url" name="url" placeholder="Paste a link" required />
      <button>Add</button>
    </form>

    <p id="title">Nothing playing</p>
    <input id="scrubber" type="range" min="0" max="0" step="1" value="0" />
    <p id="clock"></p>

    <div id="transport">
      <button data-post="/playback/previous" title="Previous" aria-label="Previous">
        &#x23EE;      </button>
      <button
        data-post="/playback/position"
        data-delta="-10"
        title="Back 10s"
        aria-label="Back 10 seconds"
      >
        &#x21B6;
      </button>
      <button id="playpause" title="Play" aria-label="Play">&#x23F5;</button>
      <button
        data-post="/playback/position"
        data-delta="10"
        title="Forward 10s"
        aria-label="Forward 10 seconds"
      >
        &#x21B7;
      </button>
      <button data-post="/playback/next" title="Next" aria-label="Next">
        &#x23ED;      </button>
    </div>

    <div id="volume-row">
      <button id="mute" title="Mute" aria-label="Mute">Mute</button>
      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        step="1"
        value="100"
        title="Volume"
        aria-label="Volume"
      />
    </div>

    <div id="errors"></div>

    <h2>Queue</h2>
    <ol id="queue"></ol>
    <button id="clear">Clear queue</button>

    <script src="/app.js" defer></script>
  </body>
</html>
