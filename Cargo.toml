[package]
name = "mpvcast"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
libmpv2 = "5.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
