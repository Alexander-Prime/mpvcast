[package]
name = "mpvcast"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.6"
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
futures-util = "0.3.31"
thiserror = "2"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
